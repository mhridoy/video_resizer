name: Build desktop apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-15
            label: macOS-Apple-Silicon
          - os: macos-15-intel
            label: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-Web
          path: dist/
          retention-days: 30
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Video-Resizer-*
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = `v1.0.${context.runNumber}`;
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Video Resizer ${tag}`,
              body: 'Download the Windows Setup EXE, portable EXE, or the macOS DMG for your processor. These initial builds are unsigned; your OS may show an unknown-publisher warning. All processing happens on your device.',
              draft: true,
              prerelease: false
            });
            async function upload(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) await upload(file);
                else if (/\.(exe|dmg|zip)$/.test(entry.name)) {
                  await github.rest.repos.uploadReleaseAsset({
                    ...context.repo, release_id: release.id, name: entry.name,
                    data: fs.readFileSync(file)
                  });
                }
              }
            }
            await upload('artifacts');
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, make_latest: 'true' });
