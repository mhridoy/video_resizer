name: Build Windows installer, Mac app and web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set unique update version
        shell: bash
        run: npm version "1.2.$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" --no-git-tag-version
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set unique version
        run: npm version "1.2.$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" --no-git-tag-version
      # Unsigned, ad-hoc signed build. Apple notarization requires a paid Developer ID certificate.
      - run: npm run build && npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check bundled FFmpeg architecture
        run: |
          file "release/"*/"Binary Beat.app/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          ls -la release/*.dmg release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Binary-Beat-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-Web
          path: dist/
          retention-days: 30
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [desktop, mac, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Video-Resizer-Windows-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: Binary-Beat-macOS-*
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = `v1.2.${context.runNumber * 100 + Number(process.env.GITHUB_RUN_ATTEMPT)}`;
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Binary Beat ${tag}`,
              body: "## Download Binary Beat\n\n### Windows\n\n[**Download Windows installer (.exe)**](https://github.com/mhridoy/video_resizer/releases/latest/download/Video-Resizer-Windows-Setup.exe) — recommended for Windows 10/11, 64-bit.\n\n[Portable EXE — no installation](https://github.com/mhridoy/video_resizer/releases/latest/download/Video-Resizer-Windows-Portable.exe)\n\n### macOS 11 or later\n\n[**Mac with Apple silicon (M1–M4) .dmg**](https://github.com/mhridoy/video_resizer/releases/latest/download/Binary-Beat-macOS-arm64.dmg) · [Mac with Intel .dmg](https://github.com/mhridoy/video_resizer/releases/latest/download/Binary-Beat-macOS-x64.dmg)\n\nOpen the DMG and drag Binary Beat to Applications. The first time, right-click the app and choose **Open** (or System Settings → Privacy & Security → **Open Anyway**), because the app is not notarized by Apple.\n\n### Get started\n1. Download and install the Setup EXE.\n2. Choose your video folder, including subfolders.\n3. Choose a tool, or use **Fit to 24 MB** to shrink a whole folder of images, videos, PDFs and Office documents.\n\nFree for everyone. Original files stay untouched. Processing happens locally; FFmpeg is included.\n\n**Unsigned build:** Windows may show an unknown-publisher warning. Native conversion tests and packaging passed in GitHub Actions; interactive installer and GUI testing are still needed.\n\n[Use the web app](https://video-resizer-eta.vercel.app/)",
              draft: true,
              prerelease: false
            });
            async function upload(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) await upload(file);
                else if (/\.(exe|blockmap|yml|dmg|zip)$/.test(entry.name)) {
                  await github.rest.repos.uploadReleaseAsset({
                    ...context.repo, release_id: release.id, name: entry.name,
                    data: fs.readFileSync(file)
                  });
                }
              }
            }
            await upload('artifacts');
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, make_latest: 'true' });
