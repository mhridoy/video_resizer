name: Build Windows installer and web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-Web
          path: dist/
          retention-days: 30
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Video-Resizer-Windows-*
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = `v1.0.${context.runNumber}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Video Resizer ${tag}`,
              body: "## Download Video Resizer for Windows\n\n[**Download Windows installer (.exe)**](https://github.com/mhridoy/video_resizer/releases/latest/download/Video-Resizer-Windows-Setup.exe) — recommended for Windows 10/11, 64-bit.\n\n[Portable EXE — no installation](https://github.com/mhridoy/video_resizer/releases/latest/download/Video-Resizer-Windows-Portable.exe)\n\n### Get started\n1. Download and install the Setup EXE.\n2. Choose your video folder, including subfolders.\n3. Select your resolution and click **Optimize videos**.\n\nOriginal videos stay untouched. Processing happens locally; FFmpeg is included.\n\n**Unsigned build:** Windows may show an unknown-publisher warning. Native conversion tests and packaging passed in GitHub Actions; interactive installer and GUI testing are still needed.\n\n[Use the web app](https://video-resizer-eta.vercel.app/)",
              draft: true,
              prerelease: false
            });
            async function upload(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) await upload(file);
                else if (/\.exe$/.test(entry.name)) {
                  await github.rest.repos.uploadReleaseAsset({
                    ...context.repo, release_id: release.id, name: entry.name,
                    data: fs.readFileSync(file)
                  });
                }
              }
            }
            await upload('artifacts');
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, make_latest: 'true' });
