name: Build Windows and Mac apps and web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set unique update version
        shell: bash
        run: npm version "1.2.$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" --no-git-tag-version
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
  mac:
    # One Apple silicon runner builds both Mac apps. FFmpeg is a native binary, so the Intel app
    # gets the Intel FFmpeg installed before it is packaged.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set unique version
        run: npm version "1.2.$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" --no-git-tag-version
      - run: npm run build
      - name: Package Apple silicon app
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Intel app
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg
          npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-Mac
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Resizer-Web
          path: dist/
          retention-days: 30
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [desktop, mac, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Video-Resizer-*
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = `v1.2.${context.runNumber * 100 + Number(process.env.GITHUB_RUN_ATTEMPT)}`;
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Binary Beat ${tag}`,
              body: "## Download Binary Beat\n\n### Windows\n\n[**Download Windows installer (.exe)**](https://video-resizer-eta.vercel.app/api/download?file=windows) — recommended for Windows 10/11, 64-bit.\n\n[Portable EXE — no installation](https://video-resizer-eta.vercel.app/api/download?file=windows-portable)\n\n### Mac\n\n[**Download for Apple silicon (M1–M4)**](https://video-resizer-eta.vercel.app/api/download?file=mac-arm64) · [Intel Mac](https://video-resizer-eta.vercel.app/api/download?file=mac-x64)\n\nUnsigned: the first time, right-click the app and choose **Open**. If macOS says it is damaged, run `xattr -cr \"/Applications/Binary Beat.app\"` in Terminal.\n\n### Get started\n1. Download and install the Setup EXE.\n2. Choose your video folder, including subfolders.\n3. Choose a tool, or use **Container Load Pack** to prepare load photos, videos, invoices and weight tickets under 24 MB.\n\nFile compression runs locally; FFmpeg is included. Container Load Pack saves into your chosen output folder and keeps originals by default. Replacing the imported folder is a separate explicit option. ZIP uploads remain a download workflow. Pro AI requires a configured service and sends shipment previews for analysis; local mode is available.\n\n**Unsigned build:** Windows may show an unknown-publisher warning. Native conversion tests and packaging passed in GitHub Actions; interactive installer and GUI testing are still needed.\n\n[Use the web app](https://video-resizer-eta.vercel.app/)",
              draft: true,
              prerelease: false
            });
            async function upload(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) await upload(file);
                else if (/\.(exe|dmg|blockmap|yml)$/.test(entry.name)) {
                  await github.rest.repos.uploadReleaseAsset({
                    ...context.repo, release_id: release.id, name: entry.name,
                    data: fs.readFileSync(file),
                    headers: { 'content-type': entry.name.endsWith('.zip') ? 'application/zip' : entry.name.endsWith('.yml') ? 'text/yaml' : 'application/octet-stream' }
                  });
                }
              }
            }
            await upload('artifacts');
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, make_latest: 'true' });
